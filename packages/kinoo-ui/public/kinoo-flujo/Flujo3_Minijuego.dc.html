<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const S = this.state || {};
  const C = this._common(S);
  const p = S.pick || 0;
  const pick = (i) => () => {
    const s = this.state || {};
    if (s.done === 'timeout' || s.phase !== 'play') return;
    this.setState({ pick: i });
    this._finish('pick');
  };
  const FB = ['', 'Te tiran las amistades improbables y los viajes lejos de casa.', 'Te mueven las historias con presión, genio y consecuencias.'];
  return Object.assign(C, {
    pick1: pick(1), pick2: pick(2),
    sel1: p === 1, sel2: p === 2,
    cls1: p === 1 ? 'kpop' : (C.timedOut ? 'kshake' : ''), cls2: p === 2 ? 'kpop' : (C.timedOut ? 'kshake' : ''),
    bc1: p === 1 ? '#f4e7d0' : '#8a7458', bc2: p === 2 ? '#f4e7d0' : '#8a7458',
    ring1: p === 1 ? 1 : 0, ring2: p === 2 ? 1 : 0,
    op1: (p === 2 || C.timedOut) ? 0.45 : 1, op2: (p === 1 || C.timedOut) ? 0.45 : 1,
    footTop: C.isDone ? 782 : 753,
    toastTitle: C.timedOut ? 'Se acabó el tiempo' : '¡Anotado!',
    toastText: C.timedOut ? 'No pasa nada, lo dejamos para otra vez.' : FB[p]
  });
}
_resetGame() { return { pick: 0 }; }

// ——— Motor común de minijuego: carga → 10 s → feedback ———
// Arranca cada vez que la pantalla entra en vista (y se detiene al salir).
_begin() {
  this._live = true; this._clear();
  this.setState(Object.assign({ phase: 'intro', introOut: false, left: 10, done: null, runAt: 0 }, this._resetGame()));
  this._ti1 = setTimeout(() => this.setState({ introOut: true }), 2300);
  this._ti2 = setTimeout(() => this._play(), 2650);
}
_play() {
  clearTimeout(this._ti1); clearTimeout(this._ti2);
  if ((this.state || {}).phase === 'play') return;
  this.setState({ phase: 'play', introOut: true, runAt: Date.now(), left: 10 });
  clearInterval(this._iv);
  this._iv = setInterval(() => {
    const s = this.state || {};
    if (s.done || s.phase !== 'play') { clearInterval(this._iv); return; }
    const left = Math.max(0, 10 - Math.floor((Date.now() - s.runAt) / 1000));
    if (left !== s.left) this.setState({ left });
    if (left === 0) this._finish('timeout');
  }, 200);
}
_finish(kind) {
  const s = this.state || {};
  if (s.done || s.phase !== 'play') return;
  clearInterval(this._iv);
  this.setState({ done: kind });
}
_clear() { clearTimeout(this._ti1); clearTimeout(this._ti2); clearInterval(this._iv); }
_stop() { this._live = false; this._clear(); }
_setRoot(el) {
  if (!el || this._obs || typeof IntersectionObserver === 'undefined') return;
  this._obs = new IntersectionObserver((es) => {
    const e = es[es.length - 1];
    const vis = e.isIntersecting && e.intersectionRatio >= 0.5;
    if (vis && !this._live) this._begin();
    else if (!vis && this._live) this._stop();
  }, { threshold: [0, 0.5, 1] });
  this._obs.observe(el);
}
componentDidMount() { this._fb = setTimeout(() => { if (!this._obs && !this._live) this._begin(); }, 400); }
componentWillUnmount() { this._stop(); clearTimeout(this._fb); if (this._obs) this._obs.disconnect(); }
_common(S) {
  const phase = S.phase || 'intro';
  const left = typeof S.left === 'number' ? S.left : 10;
  const done = S.done || null;
  const urgent = phase === 'play' && !done && left <= 3;
  if (!this._sr) this._sr = (el) => this._setRoot(el);
  return {
    setRoot: this._sr,
    introOn: phase === 'intro', introOp: S.introOut ? 0 : 1, skipIntro: () => this._play(),
    timeLabel: (done === 'timeout' ? 0 : left) + ' s',
    timeW: phase !== 'play' ? 100 : (done === 'timeout' ? 0 : left * 10),
    timeBg: urgent ? '#b83a26' : '#f4e7d0', timeInk: urgent ? '#f4e7d0' : '#1a1411',
    timeCls: urgent ? 'kpulse' : '', barBg: urgent ? '#b83a26' : '#f2b544',
    isDone: !!done, notDone: !done, timedOut: done === 'timeout', picked: done === 'pick',
    toastBg: done === 'timeout' ? '#2a1d18' : '#5e0c10',
    ctaLabel: done === 'timeout' ? 'seguir' : 'continuar'
  };
}
}
</script>
