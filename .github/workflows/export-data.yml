name: Exportar datos (anonimizados)
on:
  schedule:
    - cron: '0 4 * * *'   # 23:00 en Colombia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bajar el Sheet, quitar nombres y escribir data/
        run: node scripts/export-sheet.mjs
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          READ_KEY: ${{ secrets.READ_KEY }}
      - name: Commit
        run: |
          git config user.name "kinoo-bot"
          git config user.email "kinoo-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "datos: export $(date -u +%F)"
          git push
